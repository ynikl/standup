name: StandUp
options:
  bundleIdPrefix: com.standup
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "6.0"
packages:
  StandUpCore:
    path: .
targets:
  StandUpiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Apps/iOS
      - Apps/Shared
    dependencies:
      - package: StandUpCore
        product: StandUpCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.standup.app
        INFOPLIST_FILE: Apps/iOS/Info.plist
        PRODUCT_NAME: StandUp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  StandUpWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Apps/Watch
      - Apps/Shared
    dependencies:
      - package: StandUpCore
        product: StandUpCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.standup.watch
        INFOPLIST_FILE: Apps/Watch/Info.plist
        PRODUCT_NAME: StandUp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  StandUp:
    build:
      targets:
        StandUpiOS: all
        StandUpWatch: all
    run:
      config: Debug
    test:
      config: Debug
